<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stock Listing</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Nest mode puts the svg inside the <i> instead of replacing it, so Angular keeps ownership of the element -->
  <!-- The saved light or dark choice, and the Overview's layout, are set before the first paint so a page never flashes the wrong colors -->
  <script>try{var t=localStorage.getItem('stock-listing-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);if(location.pathname.indexOf('/overview')===0)document.documentElement.classList.add('admin-layout')}catch(e){}</script>
  <script>window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };</script>
  <script src="https://kit.fontawesome.com/9722f49037.js" crossorigin="anonymous"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
