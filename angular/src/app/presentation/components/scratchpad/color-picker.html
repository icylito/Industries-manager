<div class="cp-backdrop" (pointerdown)="closed.emit()"></div>
<div class="cp-card" [style.left.px]="place().left" [style.top.px]="place().top">
  <h3 class="cp-title">Color Picker</h3>

  <div
    class="cp-wheel"
    #ring
    (pointerdown)="ringDown($event)"
    (pointermove)="ringMove($event)"
    (pointerup)="release()"
  >
    <span class="cp-ring" aria-hidden="true"></span>
    <span
      class="cp-hue-handle"
      [style.left.%]="hueHandle().x"
      [style.top.%]="hueHandle().y"
      [style.background]="hueColour()"
    ></span>
    <div
      class="cp-square"
      #square
      [style.--hue]="hueColour()"
      (pointerdown)="squareDown($event)"
      (pointermove)="squareMove($event)"
      (pointerup)="release()"
    >
      <span
        class="cp-sv-handle"
        [style.left.%]="hsv().s * 100"
        [style.top.%]="(1 - hsv().v) * 100"
        [style.background]="hex()"
      ></span>
    </div>
  </div>

  <div class="cp-now" aria-hidden="true">
    <span class="cp-chip" [style.background]="hex()"></span>
  </div>

  <div class="cp-fields">
    <label class="cp-field cp-hex">
      <input
        type="text"
        spellcheck="false"
        maxlength="7"
        autocomplete="off"
        aria-label="Hex colour"
        [value]="typing() ?? hex()"
        (input)="typeHex($any($event.target).value)"
        (change)="confirmHex()"
        (keydown.enter)="confirmHex()"
      />
      <span>#</span>
    </label>
    <label class="cp-field">
      <input
        type="number"
        min="0"
        max="255"
        inputmode="numeric"
        aria-label="Red"
        [value]="rgb().r"
        (input)="typeChannel('r', $any($event.target).value)"
        (change)="release()"
      />
      <span>R</span>
    </label>
    <label class="cp-field">
      <input
        type="number"
        min="0"
        max="255"
        inputmode="numeric"
        aria-label="Green"
        [value]="rgb().g"
        (input)="typeChannel('g', $any($event.target).value)"
        (change)="release()"
      />
      <span>G</span>
    </label>
    <label class="cp-field">
      <input
        type="number"
        min="0"
        max="255"
        inputmode="numeric"
        aria-label="Blue"
        [value]="rgb().b"
        (input)="typeChannel('b', $any($event.target).value)"
        (change)="release()"
      />
      <span>B</span>
    </label>
    @if (canDropper) {
      <button
        type="button"
        class="cp-dropper"
        (click)="dropper()"
        title="Pick a colour from the screen"
        aria-label="Pick a colour from the screen"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M14 4l6 6M16 6l-9 9-2 5 5-2 9-9M15 7l2-2a2 2 0 0 1 3 3l-2 2" />
        </svg>
      </button>
    }
  </div>
</div>
