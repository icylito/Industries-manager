<div class="modal-backdrop" (click)="busy() ? null : no.emit()" aria-hidden="true"></div>
<div class="modal-wrap">
  <section
    class="modal confirm-modal"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
  >
    <h2 id="confirm-title">Are you sure?</h2>
    <!-- The space is an interpolation because Angular drops a plain one that sits next to a tag or at the end of a block -->
    <p>
      @if (name()) {
        <strong>{{ name() }}</strong
        >{{ ' ' }}
      }
      {{ detail() }}
    </p>
    <div class="form-actions">
      <button type="button" class="cancel-btn" [disabled]="busy()" (click)="no.emit()">No</button>
      <button type="button" class="add-btn" [disabled]="busy()" (click)="yes.emit()">
        @if (busy()) {
          <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>Deleting
        } @else {
          <i class="fa-solid fa-trash" aria-hidden="true"></i>Yes, delete
        }
      </button>
    </div>
  </section>
</div>
