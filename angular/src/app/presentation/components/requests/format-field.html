<div class="wrap">
  <div
    #box
    class="editor"
    [class.empty]="empty()"
    role="textbox"
    aria-multiline="true"
    contenteditable="true"
    spellcheck="true"
    [attr.aria-label]="label() || null"
    [attr.data-placeholder]="placeholder()"
    [style.min-height.rem]="rows() * 1.4 + 1.5"
    (input)="emit()"
    (beforeinput)="onBeforeInput($any($event))"
    (keydown)="onKey($event)"
    (paste)="onPaste($event)"
    (drop)="$event.preventDefault()"
  ></div>
  <!-- Always under the box, so it's clear the text can be formatted. Whatever the page puts inside the tag sits on the right. -->
  <div class="below">
    <div
      class="strip"
      role="toolbar"
      [attr.aria-label]="'Format ' + (label() || 'the text')"
      (mousedown)="$event.preventDefault()"
      (pointerdown)="$event.preventDefault()"
    >
      @for (b of buttons; track b.mark) {
        <button
          type="button"
          [attr.aria-label]="b.label"
          [attr.aria-pressed]="pressed().includes(b.mark)"
          [attr.title]="b.label + ' (' + b.keys + ')'"
          [class]="'mark-' + b.mark"
          [class.on]="pressed().includes(b.mark)"
          (click)="apply(b.mark)"
        >
          @switch (b.mark) {
            @case ('bold') {
              <span class="glyph bold" aria-hidden="true">B</span>
            }
            @case ('italic') {
              <span class="glyph italic" aria-hidden="true">I</span>
            }
            @default {
              <span class="glyph mono" aria-hidden="true">&lt;/&gt;</span>
            }
          }
        </button>
      }
    </div>
    <ng-content />
  </div>
</div>
