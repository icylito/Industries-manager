<div class="app">
    <nav class="nav">
        <a class="brand" routerLink="/"><i class="fa-solid fa-chart-simple" aria-hidden="true"></i>Stock Listing</a>
        <div class="nav-links">
            <a routerLink="/" fragment="browse" aria-label="Browse"><i class="fa-solid fa-table-list" aria-hidden="true"></i><span>Browse</span></a>
            <a routerLink="/" fragment="add" aria-label="Add"><i class="fa-solid fa-plus" aria-hidden="true"></i><span>Add</span></a>
            <a routerLink="/history" routerLinkActive="active" aria-label="History"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i><span>History</span></a>
            <a routerLink="/fields" routerLinkActive="active" aria-label="Fields"><i class="fa-solid fa-sliders" aria-hidden="true"></i><span>Fields</span></a>
            <!-- The bell shows how many requests are waiting for a developer -->
            <a routerLink="/requests" routerLinkActive="active" class="bell"
                [attr.aria-label]="api.openRequests() ? 'Requests, ' + api.openRequests() + ' open' : 'Requests'">
                <i class="fa-solid fa-bell" aria-hidden="true"></i><span>Requests</span>
                @if (api.openRequests()) {
                    <b class="badge" aria-hidden="true">{{ api.openRequests() > 99 ? '99+' : api.openRequests() }}</b>
                }
            </a>
        </div>
    </nav>

    <header class="hero">
        <h1>{{ page().title }}</h1>
        <p class="lede">{{ page().lede }}</p>
    </header>

    <router-outlet />
</div>
