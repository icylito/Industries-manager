<div class="ex-head">
    <button type="button" class="ex-toggle" [attr.aria-expanded]="open()" [attr.aria-controls]="'ex-' + key()" (click)="toggle()">
        <svg class="ex-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        <span class="ex-title">{{ heading() }}</span>
    </button>
    <span class="ex-actions" [hidden]="!open()"><ng-content select="[exAction]"></ng-content></span>
</div>
<div class="ex-body" [id]="'ex-' + key()" [hidden]="!open()">
    <ng-content></ng-content>
</div>
